<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .shops {
            display: flex;
            justify-content: center;
            gap: 50px;
            text-align: center;
        }
        .shop-item img {
            width: 200px;
            height: 150px;
            object-fit: contain;
        }
        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Welcome to Online Stores!</h1>
    <div class="shops">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <br>
            <a href="https://www.amazon.com" target="_blank">Amazon</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <br>
            <a href="https://www.ebay.com" target="_blank">eBay</a>
        </div>
    </div>
    <hr>
    <footer>
        © kchoowar 2026
    </footer>
</body>
</html>
