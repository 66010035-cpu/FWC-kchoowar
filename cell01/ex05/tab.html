<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            height: 150px;
            padding: 10px;
            vertical-align: middle;
        }
        .cell-one {
            background-color: #b5c98d;
        }
        .cell-two {
            background-color: #f7d3aa;
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <td class="cell-one">First Cell</td>
            <td class="cell-two">Second Cell</td>
        </tr>
    </table>
</body>
</html>
