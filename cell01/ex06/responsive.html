<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            width: 50%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        .cell-one {
            background-color: #b5c98d;
        }
        .cell-two {
            background-color: #f7d3aa;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cell-one">First Cell</td>
            <td class="cell-two">Second Cell</td>
        </tr>
    </table>
</body>
</html>
