<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f9fafb; }
        .container { width: 350px; text-align: center; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #newBtn { padding: 8px 16px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
        #ft_list div { background: #e5e7eb; padding: 10px; margin-bottom: 8px; border-radius: 6px; text-align: left; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>To Do List (jQuery)</h1>
        <button id="newBtn">New</button>
        <div id="ft_list"></div>
    </div>

    <script>
        $(document).ready(function() {
            function setCookie(name, value, days) {
                const expires = new Date(Date.now() + days * 864e5).toUTCString();
                document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
            }

            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = $.trim(ca[i]);
                    if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
                return '';
            }

            function saveTodos() {
                const todos = [];
                $('#ft_list div').each(function() {
                    todos.push($(this).text());
                });
                setCookie('ft_list', JSON.stringify(todos), 365);
            }

            function createTodo(text) {
                const $div = $('<div></div>').text(text);
                $div.click(function() {
                    if (confirm('Do you want to remove this TO DO?')) {
                        $(this).remove();
                        saveTodos();
                    }
                });
                $('#ft_list').prepend($div);
            }

            const savedData = getCookie('ft_list');
            if (savedData) {
                try {
                    const todos = JSON.parse(savedData);
                    for (let i = todos.length - 1; i >= 0; i--) {
                        createTodo(todos[i]);
                    }
                } catch(e) {}
            }

            $('#newBtn').click(function() {
                const text = prompt('Enter a new TO DO:');
                if (text && $.trim(text) !== '') {
                    createTodo($.trim(text));
                    saveTodos();
                }
            });
        });
    </script>
</body>
</html>
